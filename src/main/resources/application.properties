spring.application.name=MARKER

# Use H2 in-memory database for local dev to avoid missing datasource errors
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:markerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.security.user.name=${APP_SECURITY_USER:marker}
spring.security.user.password=${APP_SECURITY_PASSWORD:marker-dev-password}
