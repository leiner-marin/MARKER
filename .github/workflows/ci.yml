name: MARKER CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: bash mvnw -B clean verify

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Verify authenticated API
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error \
              -u marker-admin:marker-dev-password \
              http://localhost:8080/api/catalog; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
